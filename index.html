<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucas Wagner Araujo" />
    <title>Dev Front End</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Gerenciador de Tarefas Acadêmicas</h1>
  </header>

  <main>

    <!-- Região de Busca e Filtros -->
    <section aria-labelledby="titulo-filtros">
      <h2 id="titulo-filtros">Busca e Filtros</h2>
      <form role="search">
        <div>
          <label for="busca-titulo">Buscar por título da tarefa:</label>
          <input type="search" id="busca-titulo" name="busca" placeholder="Ex: Relatório de banco de dados">
        </div>

        <div>
        <fieldset>
        <legend>Filtrar por Status:</legend>

        <div>
            <input type="radio" id="status-todos" name="status" value="" checked>
            <label for="status-todos">Todos</label>
        </div>

        <div>
            <input type="radio" id="status-a-fazer" name="status" value="a-fazer">
            <label for="status-a-fazer">A fazer</label>
        </div>

        <div>
            <input type="radio" id="status-em-andamento" name="status" value="em-andamento">
            <label for="status-em-andamento">Em andamento</label>
        </div>

        <div>
            <input type="radio" id="status-em-revisao" name="status" value="em-revisao">
            <label for="status-em-revisao">Em revisão</label>
        </div>

        <div>
            <input type="radio" id="status-concluida" name="status" value="concluida">
            <label for="status-concluida">Concluída</label>
        </div>
        </fieldset>
                </div>

          <fieldset>
            <legend>Filtrar por Prioridade:</legend>
            <div>
              <input type="radio" id="prio-todas" name="prioridade-filtro" value="" checked>
              <label for="prio-todas">Todas</label>
            </div>
            <div>
              <input type="radio" id="prio-baixa" name="prioridade-filtro" value="baixa">
              <label for="prio-baixa">Baixa</label>
            </div>
            <div>
              <input type="radio" id="prio-media" name="prioridade-filtro" value="media">
              <label for="prio-media">Média</label>
            </div>
            <div>
              <input type="radio" id="prio-alta" name="prioridade-filtro" value="alta">
              <label for="prio-alta">Alta</label>
            </div>
          </fieldset>

          <div>
            <label for="ordenacao">Ordenar por prazo:</label>
            <select id="ordenacao" name="ordenacao">
              <option value="prazo-asc">Mais próximo primeiro</option>
              <option value="prazo-desc">Mais distante primeiro</option>
            </select>
          </div>

          <button type="button" id="limpar-filtros">Limpar filtros</button>
      </form>
    </section>

    <!-- Visão de Quadro (Quatro Agrupamentos por Status) -->
    <section aria-labelledby="titulo-quadro">
      <h2 id="titulo-quadro">Quadro de Tarefas</h2>
      <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="quadro-tarefas"></div>
    </section>

  </main>

  <!-- Rodapé da Página (Landmark Contentinfo) -->
  <footer>
    <p>Desenvolvido por: <strong>Lucas Wagner Araujo</strong></p>
    <p>Disciplina: Desenvolvimento Frontend — 2026.2</p>
  </footer>

  <script type="module" src="./script.js"></script>
</body>
</html>
